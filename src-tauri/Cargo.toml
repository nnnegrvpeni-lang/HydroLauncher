[package]
name = "hydro-launcher"
version = "0.2.5"
description = "Clean, minimal Minecraft launcher supporting Java Edition and Horizon (Rust)"
authors = ["HydroLauncher"]
edition = "2021"

[lib]
name = "hydro_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = "2"
flate2 = "1"
tar = "0.4"
directories = "6"
sysinfo = "0.33"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
rfd = "0.15"
