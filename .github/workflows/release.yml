name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach installers to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HydroLauncher ${{ github.ref_name }}
          releaseBody: |
            Установщики HydroLauncher для Windows x64 собраны автоматически из тега `${{ github.ref_name }}`.

            Полный список изменений — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          releaseDraft: false
          prerelease: false

      - name: Prepare portable binary
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $name = "HydroLauncher_${version}_x64_portable.exe"
          Copy-Item "src-tauri/target/release/hydro-launcher.exe" $name
          "PORTABLE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload portable binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.PORTABLE_NAME }}
