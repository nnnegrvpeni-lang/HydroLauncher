name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach installers to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: HydroLauncher ${{ github.ref_name }}
          releaseBody: |
            HydroLauncher ${{ github.ref_name }} для Windows x64.

            ### Что нового
            Полный список изменений — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ### Как установить
            - `HydroLauncher_*_x64-setup.exe` — обычный установщик (NSIS), рекомендуется большинству.
            - `HydroLauncher_*_x64_en-US.msi` — MSI для установки через GPO или командную строку.
            - `HydroLauncher_*_x64_portable.exe` — портативная версия без установки.

            ### Требования
            - Windows 10 или 11, x64.
            - Microsoft Edge WebView2 Runtime (в Windows 11 уже установлен; на Windows 10 может понадобиться доустановить).

            ### Проверка файлов
            SHA-256 всех файлов лежит в `SHA256SUMS.txt` и рядом с каждым asset на этой странице.

            Сборки не подписаны сертификатом, поэтому SmartScreen может показать предупреждение. Перед запуском сверьте SHA-256.

            ### Обратная связь
            Баги и предложения — в [Issues](https://github.com/${{ github.repository }}/issues/new/choose).
          releaseDraft: false
          prerelease: false

      - name: Prepare portable binary
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $name = "HydroLauncher_${version}_x64_portable.exe"
          Copy-Item "src-tauri/target/release/hydro-launcher.exe" $name
          "PORTABLE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Prepare checksums
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $portable = "HydroLauncher_${version}_x64_portable.exe"
          $files = @()
          $files += Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $files += Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (Test-Path $portable) { $files += Get-Item $portable }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLower()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload portable binary and checksums
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ env.PORTABLE_NAME }}
            SHA256SUMS.txt
